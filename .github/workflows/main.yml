name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: awpl
      DJANGO_SETTINGS_MODULE: awpl.settings
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirments.txt

      - name: Build static export
        working-directory: awpl
        run: |
          mkdir -p ../site
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          import django

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "awpl.settings")
          django.setup()

          from django.http import HttpRequest
          from awpl import views

          root = Path("../site")
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True, exist_ok=True)

          def render_view(view_func, path, output_name):
              request = HttpRequest()
              request.path = path
              response = view_func(request)
              html = response.content.decode("utf-8")
              out_path = root / output_name
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text(html, encoding="utf-8")

          render_view(views.home, "/", "index.html")
          render_view(views.about, "/about/", "about/index.html")
          render_view(views.contact, "/contact/", "contact/index.html")

          static_src = Path("static")
          if static_src.exists():
              shutil.copytree(static_src, root / "static", dirs_exist_ok=True)

          media_src = Path("media")
          if media_src.exists():
              shutil.copytree(media_src, root / "media", dirs_exist_ok=True)

          (root / ".nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
